services:
  - type: web
    name: hospital-guide-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: PORT
        generateValue: false
